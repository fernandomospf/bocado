# Bocado — deploy completo (Coolify ou docker compose)
# Associe o domínio público apenas ao serviço "frontend" (porta 3000).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bocado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bocado}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bocado} -d ${POSTGRES_DB:-bocado}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-bocado}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bocado}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      APP_URL: ${APP_URL:?Defina APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_MODEL_PHOTO: ${ANTHROPIC_MODEL_PHOTO:-}
      ANTHROPIC_MODEL_TEXT: ${ANTHROPIC_MODEL_TEXT:-}
      ANTHROPIC_MODEL_LABEL: ${ANTHROPIC_MODEL_LABEL:-}
      ANTHROPIC_MODEL_SUGGEST: ${ANTHROPIC_MODEL_SUGGEST:-}
      AI_DAILY_LIMIT_PHOTO: ${AI_DAILY_LIMIT_PHOTO:-8}
      AI_DAILY_LIMIT_TEXT: ${AI_DAILY_LIMIT_TEXT:-15}
      AI_DAILY_LIMIT_LABEL: ${AI_DAILY_LIMIT_LABEL:-4}
      AI_DAILY_LIMIT_SUGGEST: ${AI_DAILY_LIMIT_SUGGEST:-3}
      AI_MONTHLY_LIMIT_TOTAL: ${AI_MONTHLY_LIMIT_TOTAL:-200}
      AI_QUOTA_TZ: ${AI_QUOTA_TZ:-America/Sao_Paulo}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-}
      AI_PRICES_JSON: ${AI_PRICES_JSON:-}
      OFF_CONTACT: ${OFF_CONTACT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      BETA_MAX_USERS: ${BETA_MAX_USERS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: http://backend:3001
        NEXT_PUBLIC_TURNSTILE_SITEKEY: ${NEXT_PUBLIC_TURNSTILE_SITEKEY:-}
        NEXT_PUBLIC_APP_URL: ${APP_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  postgres-data:
